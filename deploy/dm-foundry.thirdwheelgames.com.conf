<VirtualHost *:80>
    ServerName dm-foundry.thirdwheelgames.com
    ServerAdmin admin@thirdwheelgames.com
    DocumentRoot /var/www/dm-foundry

    <Directory /var/www/dm-foundry>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Files "module.json">
        Header set Access-Control-Allow-Origin "*"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/dm-foundry-error.log
    CustomLog ${APACHE_LOG_DIR}/dm-foundry-access.log combined
</VirtualHost>
